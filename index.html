<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Motion: Unwind Christmas Edition | Register</title>
<link rel="icon" type="image/png" href="/motion-unwind-logo-transparent-512.png">
<link rel="apple-touch-icon" href="/motion-unwind-logo-transparent-512.png">
<meta property="og:image" content="https://motion-unwind-registration.vercel.app/motion-unwind-logo-transparent-512.png">
<meta property="og:image:secure_url" content="https://motion-unwind-registration.vercel.app/motion-unwind-logo-transparent-512.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://motion-unwind-registration.vercel.app/motion-unwind-logo-transparent-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Animations only run for people who haven't asked their device to reduce motion.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");
</script>
<style>
  :root {
    --forest: #122d21;
    --pine: #214d37;
    --emerald: #0f6b47;
    --cream: #faf5e8;
    --ivory: #f5eee0;
    --champagne: #d9bd7a;
    --gold: #c9a24a;
    --burgundy: #7a1224;
    --cranberry: #a4162b;
    --ink: #1b2a22;
    --muted: #5d6b63;
    --line: #dccfae;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--forest);
    color: var(--ivory);
    font-family: var(--sans);
    line-height: 1.5;
    padding: 40px 20px 56px;
  }
  main { max-width: 560px; margin: 0 auto; }

  header { text-align: center; }
  .host { margin: 0 0 14px; font-size: 13px; letter-spacing: .28em; color: var(--champagne); font-weight: 600; }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(52px, 15vw, 84px);
    line-height: .98;
    letter-spacing: -.01em;
    color: var(--cream);
  }
  .edition {
    margin: 10px 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(22px, 6vw, 32px);
    color: var(--champagne);
  }
  .rule { width: 120px; height: 2px; background: var(--gold); border: 0; margin: 26px auto; }
  .when { margin: 0; font-weight: 600; font-size: 17px; color: var(--cream); }
  .intro { margin: 10px auto 0; max-width: 440px; color: #d8dccf; }

  .card {
    margin-top: 32px;
    background: var(--cream);
    color: var(--ink);
    border: 1px solid var(--gold);
    border-radius: 18px;
    padding: 28px 24px 26px;
  }
  .card h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 26px; color: var(--forest); }
  .card .sub { margin: 0 0 22px; color: var(--muted); font-size: 15px; }

  .field { margin-bottom: 20px; border: 0; padding: 0; min-width: 0; }
  label, legend { display: block; padding: 0; margin-bottom: 7px; font-weight: 600; font-size: 15px; color: var(--forest); }
  .hint { font-weight: 400; color: var(--muted); }

  input[type="text"], input[type="tel"], textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  textarea { resize: vertical; min-height: 84px; }
  input::placeholder, textarea::placeholder { color: #9aa39d; }
  input:focus-visible, textarea:focus-visible { outline: 3px solid var(--emerald); outline-offset: 1px; border-color: var(--emerald); }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices label {
    margin: 0;
    padding: 11px 18px;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 999px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  .choices input:checked + label { background: var(--forest); border-color: var(--forest); color: var(--cream); }
  .choices input:focus-visible + label { outline: 3px solid var(--emerald); outline-offset: 2px; }
  .venue { margin: 8px 0 0; font-size: 14px; color: var(--muted); min-height: 21px; }

  .error { color: var(--cranberry); font-size: 14px; margin-top: 6px; min-height: 0; }
  .form-error {
    display: none;
    margin: 0 0 16px;
    padding: 12px 14px;
    background: #fbe9ea;
    border: 1px solid #e2a9ae;
    border-radius: 10px;
    color: var(--cranberry);
    font-size: 15px;
  }
  .form-error.show { display: block; }

  button.primary {
    width: 100%;
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    padding: 15px 20px;
    border: 0;
    border-radius: 12px;
    background: var(--gold);
    color: var(--forest);
    cursor: pointer;
    min-height: 52px;
  }
  button.primary:hover { background: var(--champagne); }
  button.primary:focus-visible { outline: 3px solid var(--emerald); outline-offset: 3px; }
  button.primary:disabled { opacity: .6; cursor: wait; }

  .done { display: none; text-align: center; padding: 8px 0 4px; }
  .done h2 { font-size: 30px; }
  .done p { margin: 10px 0 0; color: var(--ink); }
  .done .detail { color: var(--muted); }
  .done .check {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
    background: var(--emerald); color: var(--cream);
    display: grid; place-items: center; font-size: 28px;
  }
  .card.is-done form { display: none; }
  .card.is-done .done { display: block; }
  .card.is-done > h2, .card.is-done > .sub { display: none; }

  .dress { margin-top: 30px; text-align: center; color: #d8dccf; font-size: 15px; }
  .swatches { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .swatches span { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); }
  .dress strong { color: var(--champagne); font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 19px; display: block; margin-bottom: 2px; }

  main { position: relative; z-index: 1; }
  [hidden] { display: none !important; }
  body.loading main { visibility: hidden; }
  .h1-word { display: inline-block; white-space: nowrap; }

  /* Drifting gold specks behind everything */
  .specks { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .specks span {
    position: absolute; top: -10px; border-radius: 50%;
    animation: fall 20s linear infinite, twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes fall { from { transform: translate3d(0, -10px, 0); } to { transform: translate3d(var(--drift, 0px), 108vh, 0); } }
  @keyframes twinkle { from { opacity: .12; } to { opacity: .7; } }

  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* Opening sequence: letters rise one by one, the rule draws, then the rest fades in together */
  .motion.ready .ch { display: inline-block; animation: letter .7s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes letter { from { opacity: 0; transform: translateY(.45em) rotate(5deg); } to { opacity: 1; transform: none; } }
  .motion.ready .host { animation: fade .8s ease-out both; }
  .motion.ready .rule { transform-origin: center; animation: draw .7s cubic-bezier(.3, .7, .2, 1) .9s both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .motion.ready .edition { animation: fade .9s ease-out 1s both; }
  .motion.ready .when, .motion.ready .countdown, .motion.ready .intro, .motion.ready .card, .motion.ready .dress { animation: fade 1s ease-out 1.4s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .countdown { margin: 14px auto 0; }
  .countdown-units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(5px, 2vw, 10px); width: min(100%, 340px); margin: 0 auto; }
  .countdown-box {
    min-width: 0; padding: 8px 4px; border: 1px solid var(--gold); border-radius: 10px;
    background: var(--cream); color: var(--forest); font-variant-numeric: tabular-nums;
  }
  .countdown-number { display: block; font-family: var(--serif); font-size: clamp(22px, 7vw, 32px); line-height: 1.15; }
  .countdown-label { display: block; font-family: var(--sans); font-size: clamp(9px, 3vw, 12px); line-height: 1.3; }
  .countdown-box.changed { animation: countdown-change .25s ease-out; }
  @keyframes countdown-change { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .countdown-today { margin: 0; color: var(--champagne); font-family: var(--serif); font-size: 19px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Responses to what the person does */
  .motion .choices label, .motion button.primary { transition: background-color .15s, color .15s, border-color .15s, transform .15s; }
  .motion .choices input:checked + label { animation: chip .28s ease-out; }
  @keyframes chip { 50% { transform: scale(1.07); } }
  .motion button.primary:hover:not(:disabled) { transform: translateY(-1px); }
  .motion button.primary:active:not(:disabled) { transform: scale(.98); }
  .motion .card.is-done .done { animation: fade .4s ease-out; }
  .motion .card.is-done .check { animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="loading">
<div class="specks" id="specks" aria-hidden="true"></div>
<main>
  <header>
    <p class="host">BEACON MOTION</p>
    <h1 id="evTitle"></h1>
    <p class="edition" id="evSubtitle"></p>
    <hr class="rule">
    <p class="when" id="evWhen"></p>
    <div class="countdown" id="countdown" hidden>
      <div class="countdown-units" id="countdownUnits" aria-hidden="true">
        <div class="countdown-box"><span class="countdown-number" id="countDays">0</span><span class="countdown-label">Days</span></div>
        <div class="countdown-box"><span class="countdown-number" id="countHours">00</span><span class="countdown-label">Hours</span></div>
        <div class="countdown-box"><span class="countdown-number" id="countMinutes">00</span><span class="countdown-label">Minutes</span></div>
        <div class="countdown-box"><span class="countdown-number" id="countSeconds">00</span><span class="countdown-label">Seconds</span></div>
      </div>
      <p class="countdown-today" id="countdownToday" hidden>It's today. See you there!</p>
      <span class="sr-only" id="countdownTimer" role="timer" aria-live="off"></span>
    </div>
    <p class="intro" id="evIntro"></p>
  </header>

  <section class="card" id="notice" hidden>
    <h2 id="noticeTitle"></h2>
    <p class="sub" id="noticeText"></p>
  </section>

  <section class="card" id="card" hidden>
    <h2>Save your spot</h2>
    <p class="sub">It takes under a minute.</p>

    <form id="form" novalidate>
      <p class="form-error" id="formError" role="alert"></p>

      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" maxlength="100" required>
        <div class="error" id="err_full_name"></div>
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="e.g. 0888 123 456" maxlength="20" required>
        <div class="error" id="err_phone"></div>
      </div>

      <fieldset class="field">
        <legend>Which city will you celebrate in?</legend>
        <div class="choices" id="cities"></div>
        <p class="venue" id="venue" aria-live="polite"></p>
        <div class="error" id="err_city"></div>
      </fieldset>

      <div class="field">
        <label for="allergies">Allergies <span class="hint">(optional)</span></label>
        <textarea id="allergies" name="allergies" maxlength="300" placeholder="Write &ldquo;none&rdquo; or tell us what to avoid"></textarea>
      </div>

      <fieldset class="field">
        <legend>Are you bringing a friend?</legend>
        <div class="choices">
          <input type="radio" name="friend" id="friend_yes" value="yes"><label for="friend_yes">Yes</label>
          <input type="radio" name="friend" id="friend_no" value="no"><label for="friend_no">No, just me</label>
        </div>
        <div class="error" id="err_friend"></div>
      </fieldset>

      <button type="submit" class="primary" id="submit">Save my spot</button>
    </form>

    <div class="done" id="done" aria-live="polite">
      <div class="check" aria-hidden="true">&#10003;</div>
      <h2 id="doneTitle">You&rsquo;re in!</h2>
      <p id="doneWhen"></p>
      <p class="detail" id="doneVenue"></p>
      <p class="detail" id="doneDress"></p>
    </div>
  </section>

  <div class="dress" id="dress" hidden>
    <div class="swatches" aria-hidden="true">
      <span style="background:#a4162b"></span>
      <span style="background:#0f6b47"></span>
      <span style="background:#f5eee0"></span>
      <span style="background:#c9a24a"></span>
    </div>
    <span id="dressText"></span>
  </div>
</main>

<script type="module">
  import { db } from "./src/supabase.js";

  const $ = (id) => document.getElementById(id);
  const form = $("form");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let event = null;
  let CITIES = [];
  let countdownInterval = null;
  let countdownLastValues = null;
  let countdownLastMinute = null;
  const malawiDateFormat = new Intl.DateTimeFormat("en", {
    year: "numeric", month: "2-digit", day: "2-digit", timeZone: "Africa/Blantyre"
  });

  /* ---------- Load the event ---------- */
  // /?event=some-slug shows that event. With no slug, the next open upcoming event is shown.
  async function loadEvent() {
    if (!db) return { error: "config" };
    const slug = new URLSearchParams(window.location.search).get("event");
    let q = db.from("events").select("*");
    if (slug) q = q.eq("slug", slug);
    else q = q.eq("registration_open", true).gte("event_date", new Date().toISOString()).order("event_date", { ascending: true });
    const { data, error } = await q.limit(1).maybeSingle();
    if (error) return { error: "load" };
    return { event: data };
  }

  function formatWhen(iso) {
    const d = new Date(iso);
    const day = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "Africa/Blantyre" }).format(d);
    const time = new Intl.DateTimeFormat("en-GB", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Africa/Blantyre" }).format(d).toUpperCase();
    return day.replace(",", "") + ", " + time;
  }

  function showNotice(title, text) {
    $("notice").hidden = false;
    $("noticeTitle").textContent = title;
    $("noticeText").textContent = text;
  }

  function stopCountdown() {
    if (countdownInterval !== null) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }

  function sameMalawiDay(a, b) {
    const dateKey = (date) => malawiDateFormat.formatToParts(date)
      .filter((part) => part.type !== "literal")
      .map((part) => part.value)
      .join("-");
    return dateKey(a) === dateKey(b);
  }

  function updateCountdown(eventTime) {
    const remaining = Math.max(0, eventTime - Date.now());
    const todayText = $("countdownToday");
    const units = $("countdownUnits");
    const timerText = $("countdownTimer");

    if (remaining === 0) {
      units.hidden = true;
      todayText.hidden = false;
      timerText.textContent = "It's today. See you there!";
      stopCountdown();
      return;
    }

    const values = {
      Days: Math.floor(remaining / 86400000),
      Hours: Math.floor(remaining / 3600000) % 24,
      Minutes: Math.floor(remaining / 60000) % 60,
      Seconds: Math.floor(remaining / 1000) % 60
    };
    const showToday = remaining < 86400000 && sameMalawiDay(new Date(), new Date(eventTime));
    units.hidden = showToday;
    todayText.hidden = !showToday;

    if (!calm && countdownLastValues) {
      Object.keys(values).forEach((unit) => {
        if (values[unit] !== countdownLastValues[unit]) {
          const number = $("count" + unit);
          const box = number.parentElement;
          box.classList.remove("changed");
          void box.offsetWidth;
          box.classList.add("changed");
        }
      });
    }
    Object.keys(values).forEach((unit) => {
      const number = $("count" + unit);
      number.textContent = unit === "Days" ? String(values[unit]) : String(values[unit]).padStart(2, "0");
    });
    countdownLastValues = values;

    const minute = Math.floor(remaining / 60000);
    if (minute !== countdownLastMinute) {
      const days = Math.floor(minute / 1440);
      const hours = Math.floor(minute / 60) % 24;
      const minutes = minute % 60;
      const parts = [];
      if (days) parts.push(days + (days === 1 ? " day" : " days"));
      if (hours) parts.push(hours + (hours === 1 ? " hour" : " hours"));
      parts.push(minutes + (minutes === 1 ? " minute" : " minutes"));
      timerText.textContent = parts.length === 1
        ? parts[0] + " until the event"
        : parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] + " until the event";
      countdownLastMinute = minute;
    }
  }

  function startCountdown(iso) {
    stopCountdown();
    countdownLastValues = null;
    countdownLastMinute = null;
    const eventTime = new Date(iso).getTime();
    if (!Number.isFinite(eventTime) || eventTime <= Date.now()) return;
    $("countdown").hidden = false;
    updateCountdown(eventTime);
    if (eventTime > Date.now()) countdownInterval = setInterval(() => updateCountdown(eventTime), 1000);
  }

  function renderCities() {
    $("cities").replaceChildren();
    CITIES.forEach((c, i) => {
      const id = "city_" + i;
      const input = document.createElement("input");
      input.type = "radio"; input.name = "city"; input.id = id; input.value = c.name;
      const label = document.createElement("label");
      label.htmlFor = id; label.textContent = c.name;
      $("cities").append(input, label);
      input.addEventListener("change", () => {
        $("venue").textContent = c.venue ? "Venue: " + c.venue : "";
      });
    });
  }

  function animateTitle(text) {
    const h1 = $("evTitle");
    h1.textContent = text;
    if (calm) return;
    h1.setAttribute("aria-label", text);
    h1.textContent = "";
    let i = 0;
    text.split(" ").forEach((word, w) => {
      if (w) h1.append(" ");
      const wrap = document.createElement("span");
      wrap.className = "h1-word";
      wrap.setAttribute("aria-hidden", "true");
      [...word].forEach((chr) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = chr;
        s.style.animationDelay = (0.25 + i * 0.06) + "s";
        i++;
        wrap.append(s);
      });
      h1.append(wrap);
    });
  }

  async function init() {
    stopCountdown();
    $("countdown").hidden = true;
    const res = await loadEvent();
    event = res.event || null;

    if (event) {
      document.title = event.name + (event.subtitle ? ": " + event.subtitle : "") + " | Register";
      animateTitle(event.name);
      $("evSubtitle").textContent = event.subtitle || "";
      $("evSubtitle").hidden = !event.subtitle;
      $("evWhen").textContent = formatWhen(event.event_date);
      $("evIntro").textContent = event.description || "";
      $("evIntro").hidden = !event.description;
      if (event.dress_note) { $("dressText").textContent = event.dress_note; $("dress").hidden = false; }

      const eventPassed = new Date(event.event_date) < new Date();
      if (!event.registration_open || eventPassed) {
        showNotice("Registration is closed", "Thank you for your interest. Follow Beacon Motion for the next event.");
      } else {
        startCountdown(event.event_date);
        CITIES = Array.isArray(event.venues) ? event.venues : [];
        renderCities();
        $("card").hidden = false;
      }
    } else {
      animateTitle("Beacon Motion");
      $("evSubtitle").hidden = true; $("evIntro").hidden = true; $("evWhen").hidden = true;
      if (res.error === "config") showNotice("Almost there", "Supabase isn\u2019t connected yet. Add your project URL and anon key to the .env file and restart.");
      else if (res.error === "load") showNotice("We couldn\u2019t load the event", "Check your connection and refresh the page.");
      else showNotice("No event open right now", "There\u2019s no event taking registrations at the moment. Check back soon.");
    }

    document.body.classList.remove("loading");
    document.documentElement.classList.add("ready");
    if (!calm) startSpecks();
  }

  /* ---------- Form ---------- */
  function setError(field, msg) { $("err_" + field).textContent = msg || ""; }
  function showFormError(msg) {
    const el = $("formError");
    el.textContent = msg || "";
    el.classList.toggle("show", !!msg);
  }

  function validate() {
    let ok = true;
    const name = form.full_name.value.trim().replace(/\s+/g, " ");
    const phone = form.phone.value.replace(/[\s\-()]/g, "");
    const city = (form.querySelector('input[name="city"]:checked') || {}).value;
    const friend = (form.querySelector('input[name="friend"]:checked') || {}).value;

    setError("full_name", ""); setError("phone", ""); setError("city", ""); setError("friend", "");

    if (name.length < 2) { setError("full_name", "Enter your full name."); ok = false; }
    if (!/^\+?\d{7,15}$/.test(phone)) { setError("phone", "Enter a valid phone number, like 0888123456."); ok = false; }
    if (!city) { setError("city", "Choose a city."); ok = false; }
    if (!friend) { setError("friend", "Choose yes or no."); ok = false; }

    return ok ? { name, phone, city, friend, allergies: form.allergies.value.trim() } : null;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showFormError("");
    if (!db || !event) return;
    const v = validate();
    if (!v) return;

    const btn = $("submit");
    btn.disabled = true; btn.textContent = "Saving\u2026";

    const { error } = await db.from("registrations").insert({
      event_id: event.id,
      full_name: v.name,
      phone: v.phone,
      city: v.city,
      allergies: v.allergies || null,
      bringing_friend: v.friend === "yes"
    });

    if (error) {
      btn.disabled = false; btn.textContent = "Save my spot";
      if (error.code === "23505") {
        showFormError("This phone number is already registered for this event. If you need to change something, contact the organisers.");
      } else if (error.code === "42501") {
        showFormError("Registration for this event has closed.");
      } else {
        showFormError("We couldn\u2019t save your registration. Check your connection and try again.");
      }
      return;
    }

    const first = v.name.split(" ")[0];
    $("doneTitle").textContent = "You\u2019re in, " + first + "!";
    $("doneWhen").textContent = formatWhen(event.event_date);
    const city = CITIES.find((c) => c.name === v.city);
    $("doneVenue").textContent = city && city.venue ? v.city + ": " + city.venue : v.city;
    $("doneDress").textContent = event.dress_note || "";
    $("doneDress").hidden = !event.dress_note;
    $("card").classList.add("is-done");
    burst();
    $("card").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  /* ---------- Motion (skipped when the device asks for reduced motion) ---------- */
  function startSpecks() {
    const tones = ["#c9a24a", "#d9bd7a", "#f5eee0", "#d9bd7a"];
    for (let n = 0; n < 26; n++) {
      const s = document.createElement("span");
      const size = 2 + Math.random() * 3.5;
      s.style.left = Math.random() * 100 + "%";
      s.style.width = s.style.height = size + "px";
      s.style.background = tones[n % tones.length];
      s.style.setProperty("--drift", (Math.random() * 50 - 25) + "px");
      s.style.animationDuration = (16 + Math.random() * 16) + "s, " + (3 + Math.random() * 3) + "s";
      s.style.animationDelay = (-Math.random() * 30) + "s, " + (-Math.random() * 5) + "s";
      $("specks").append(s);
    }
  }

  // Confetti in the dress-code colours, fired when a registration is saved
  function burst() {
    if (calm) return;
    const cv = document.createElement("canvas");
    cv.className = "confetti";
    cv.setAttribute("aria-hidden", "true");
    document.body.append(cv);
    const dpr = window.devicePixelRatio || 1;
    const W = cv.width = window.innerWidth * dpr;
    const H = cv.height = window.innerHeight * dpr;
    const ctx = cv.getContext("2d");
    const colours = ["#a4162b", "#0f6b47", "#f5eee0", "#c9a24a", "#d9bd7a", "#7a1224"];
    const parts = Array.from({ length: 140 }, () => {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const speed = (6 + Math.random() * 10) * dpr;
      return {
        x: W / 2, y: H * 0.38,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        w: (6 + Math.random() * 5) * dpr, h: (3 + Math.random() * 3) * dpr,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
        c: colours[Math.floor(Math.random() * colours.length)]
      };
    });
    const start = performance.now();
    const DURATION = 3400;
    (function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = t > DURATION - 900 ? Math.max(0, (DURATION - t) / 900) : 1;
      parts.forEach((p) => {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.22 * dpr;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (t < DURATION) requestAnimationFrame(frame); else cv.remove();
    })(start);
  }

  init();
</script>
